# render.yaml — despliegue del backend en Render (Blueprint).
# Al conectar este repositorio en https://render.com, Render lee este archivo,
# crea la base PostgreSQL y el servicio web, y conecta las variables solo.
# La primera vez hay que sembrar la tabla: en el Shell del servicio, `npm run db:setup`.
databases:
  - name: productos-db
    plan: free
    databaseName: productos_db
    user: productos

services:
  - type: web
    name: backend-rda2
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: productos-db
          property: connectionString
      # Origen exacto del frontend en GitHub Pages (CORS). En desarrollo local
      # se usa .env con CLIENT_ORIGIN=* o http://localhost:5500
      - key: CLIENT_ORIGIN
        value: https://macalderonr07.github.io
